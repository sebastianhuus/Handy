[project]
name = "long-form-transcription-eda"
version = "0.1.0"
description = "EDA for the rolling-window long-form/meeting transcription research -- merge algorithm, WER scoring, reproducible metrics CLI. No model/audio needed for tests; see ../SPEC.md."
requires-python = ">=3.10"
dependencies = [
    "marimo>=0.9",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
notebook = "notebook_picker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["notebook_picker.py"]
